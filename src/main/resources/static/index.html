</head>

<body>

<h2>Add Student</h2>

<input id="name" placeholder="Name">
<input id="rollNo" placeholder="Roll No">
<input id="course" placeholder="Course">
<input id="marks" placeholder="Marks">

<button onclick="addStudent()">Add</button>

<hr>

<h2>Students</h2>
<button onclick="loadStudents()">Refresh</button>

<h3>Search Student</h3>
<input type="text" id="searchBox" placeholder="Search by name..." onkeyup="searchStudent()">

<div id="list"></div>

<script>

let currentId = null;

// ADD / UPDATE
function addStudent() {
    let url = "http://localhost:8080/students";
    let method = "POST";

    if (currentId) {
        url = `http://localhost:8080/students/${currentId}`;
        method = "PUT";
    }

    fetch(url, {
        method: method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            name: document.getElementById("name").value,
            rollNo: document.getElementById("rollNo").value,
            course: document.getElementById("course").value,
            marks: document.getElementById("marks").value
        })
    }).then(() => {
        currentId = null;
        clearForm();
        loadStudents();
    });
}

// LOAD ALL
function loadStudents() {
    fetch("http://localhost:8080/students")
        .then(res => res.json())
        .then(data => display(data));
}

// DISPLAY
function display(data) {
    let list = document.getElementById("list");
    list.innerHTML = "";

    data.forEach(s => {
        list.innerHTML += `
            <div class="card">
                <b>${s.name}</b> (${s.marks})<br>
                Roll No: ${s.rollNo} <br>
                Course: ${s.course} <br>

                <button class="delete" onclick="deleteStudent(${s.id})">Delete</button>
                <button class="edit" onclick="editStudent(${s.id}, '${s.name}', '${s.rollNo}', '${s.course}', ${s.marks})">Edit</button>
            </div>
        `;
    });
}

// DELETE
function deleteStudent(id) {
    fetch(`http://localhost:8080/students/${id}`, {
        method: "DELETE"
    }).then(() => loadStudents());
}

// EDIT
function editStudent(id, name, rollNo, course, marks) {
    document.getElementById("name").value = name;
    document.getElementById("rollNo").value = rollNo;
    document.getElementById("course").value = course;
    document.getElementById("marks").value = marks;

    currentId = id;
}

// SEARCH
function searchStudent() {
    let name = document.getElementById("searchBox").value;

    if (name === "") {
        loadStudents();
        return;
    }

    fetch("http://localhost:8080/students/search?name=" + name)
        .then(res => res.json())
        .then(data => display(data));
}

// CLEAR FORM
function clearForm() {
    document.getElementById("name").value = "";
    document.getElementById("rollNo").value = "";
    document.getElementById("course").value = "";
    document.getElementById("marks").value = "";
}

// AUTO LOAD
loadStudents();

</script>

</body>
